name: Android E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push supersedes an older run on the same branch.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The app under test: the official Sauce Labs release, downloaded here and never committed.
  # The job fails if the file no longer matches this SHA-256.
  APK_VERSION: 2.3.0
  APK_FILE: mda-2.3.0-27.apk
  APK_SHA256: bd3a3d6f2d50e076b2701ed2cc6a0ca82157b40a7033cf5be9f5d084b6591ec8
  # Appium 2 line; UiAutomator2 4.x is the last driver line that supports Appium 2.
  APPIUM_VERSION: 2.19.0
  UIAUTOMATOR2_VERSION: 4.2.9
  # Emulator: Android 12 (the app's target SDK), Google APIs image for Play services location.
  API_LEVEL: 31
  EMULATOR_TARGET: google_apis
  EMULATOR_ARCH: x86_64
  EMULATOR_PROFILE: pixel_6
  # The same options for the snapshot and the test run, or the snapshot cannot be reused.
  # -camera-back emulated gives the QR scanner a virtual camera to open.
  EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
  ALLURE_VERSION: 2.46.2

jobs:
  android-e2e:
    name: Emulator API 31 (Appium UiAutomator2)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # Hardware acceleration for the emulator on the hosted Linux runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download and verify the APK
        run: |
          mkdir -p apk
          curl -fsSL -o "apk/$APK_FILE" "https://github.com/saucelabs/my-demo-app-android/releases/download/$APK_VERSION/$APK_FILE"
          echo "$APK_SHA256  apk/$APK_FILE" | sha256sum -c -
          echo "APK_PATH=$GITHUB_WORKSPACE/apk/$APK_FILE" >> "$GITHUB_ENV"

      - name: Install Appium ${{ env.APPIUM_VERSION }} and UiAutomator2 ${{ env.UIAUTOMATOR2_VERSION }}
        run: |
          npm install -g "appium@$APPIUM_VERSION"
          appium driver install "uiautomator2@$UIAUTOMATOR2_VERSION"
          appium --version
          appium driver list --installed

      # Compile before the emulator starts, so emulator time is spent on tests only.
      - name: Compile tests
        run: mvn -B -ntp test-compile

      - name: Cache the emulator snapshot
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ env.EMULATOR_TARGET }}-${{ env.EMULATOR_ARCH }}-${{ env.EMULATOR_PROFILE }}

      - name: Create the emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          profile: ${{ env.EMULATOR_PROFILE }}
          force-avd-creation: false
          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          disable-animations: false
          script: echo "Snapshot created."

      - name: Run the tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          profile: ${{ env.EMULATOR_PROFILE }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save ${{ env.EMULATOR_OPTIONS }}
          disable-animations: true
          script: bash ci/run-tests.sh

      - name: Build the Allure report
        if: ${{ !cancelled() }}
        run: |
          curl -fsSL -o /tmp/allure.tgz "https://github.com/allure-framework/allure2/releases/download/$ALLURE_VERSION/allure-$ALLURE_VERSION.tgz"
          tar -xzf /tmp/allure.tgz -C /tmp
          mkdir -p target/allure-results
          /tmp/allure-$ALLURE_VERSION/bin/allure generate target/allure-results -o site --clean

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-results
          path: |
            target/allure-results
            target/surefire-reports
            artifacts
          if-no-files-found: warn
          retention-days: 30

      - uses: actions/upload-pages-artifact@v3
        if: ${{ !cancelled() }}
        with:
          path: site

  # Separate job: the github-pages environment only accepts main, so pull requests build the
  # report but do not deploy it.
  deploy:
    name: Deploy Allure report
    needs: android-e2e
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
