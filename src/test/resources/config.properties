# Appium session settings. apk.path and appium.url come from Maven system properties (see pom.xml),
# so CI and local runs can override them without editing this file.
platformName=Android
automationName=UiAutomator2
deviceName=Android Emulator
platformVersion=12
appPackage=com.saucelabs.mydemoapp.android
appActivity=com.saucelabs.mydemoapp.android.view.activities.SplashActivity
appWaitActivity=com.saucelabs.mydemoapp.android.view.activities.*
# Permissions are granted or denied by the tests themselves, never automatically.
autoGrantPermissions=false
newCommandTimeout=120
uiautomator2ServerInstallTimeout=120000
adbExecTimeout=60000
# Seconds to wait for elements.
explicitWait=15
